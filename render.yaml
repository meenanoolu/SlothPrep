services:
  - type: web
    name: slothprep
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GITHUB_TOKEN      # optional but recommended (60 -> 5000 GitHub req/h)
        sync: false
      - key: LLM_BASE_URL      # optional: any OpenAI-compatible open-weight endpoint
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
